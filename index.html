<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valdoria — Construtor de Reino</title>
    
    <!-- Estilos Modulares (CSS) -->
    <!-- O arquivo style.css agora importa: Base, Layout e Componentes -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Ícones (Google Material Icons) -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body>

    <!-- CABEÇALHO GLOBAL -->
    <header class="main-header">
        <h1>Valdoria</h1>
        <div class="header-meta">
            <span>População: <strong id="meta-pop">0</strong></span>
            <span>Saldo: <strong id="meta-saldo">0 PO</strong></span>
        </div>
    </header>

    <!-- ONDE TUDO ACONTECE (Renderizado pelo JS) -->
    <main id="kingdom-root">
        <div class="empty-state">
            <p>Carregando reino...</p>
        </div>
    </main>

    <!-- BOTÕES FLUTUANTES (FAB) -->
    
    <!-- Botão de Exportar Contexto (Aparece apenas na edição) -->
    <button id="fab-export" class="fab btn-export" title="Exportar Contexto para IA">
        <span class="material-icons-round">file_download</span>
    </button>

    <!-- Botão Mestre de Edição -->
    <button id="fab-mode" class="fab" title="Alternar Modo Edição">
        <span class="material-icons-round icon-default">edit</span>
        <span class="material-icons-round icon-active">close</span>
    </button>

    <div id="modal-password" class="modal-overlay hidden">
        <div class="modal-content">
            <span class="material-icons-round modal-icon">lock</span>
            <h2>Chave do Reino</h2>
            <p>Insira a senha para ativar o modo de edição.</p>
            <input type="password" id="input-pass" placeholder="Digite a senha..." autofocus>
            <div class="modal-actions">
                <button id="btn-cancel-pass" class="btn-modal-secondary">Cancelar</button>
                <button id="btn-confirm-pass" class="btn-modal-primary">Entrar</button>
            </div>
        </div>
    </div>

    <!-- LÓGICA MODULAR (JS) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
